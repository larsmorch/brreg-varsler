name: Sjekk Brønnøysundregistrene

on:
  schedule:
    # Kjører hver dag kl 08:00 UTC (Tilsvarer kl 09:00 eller 10:00 norsk tid, avhengig av sommertid)
    - cron: '0 8 * * *'
  workflow_dispatch: # Legger til en knapp så du kan kjøre scriptet manuelt når du vil

jobs:
  sjekk-regnskap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Sjekk ut kode fra repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kjør Python-script
        env:
          EPOST_PASSORD: ${{ secrets.EPOST_PASSORD }}
        run: python script.py

      - name: Lagre endringer tilbake til GitHub
        run: |
          # Sett opp hvem som committer (GitHub Bot)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Forsøk å legge til json-filen hvis den ble opprettet eller endret
          git add siste_regnskap.json || true
          
          # Sjekk om det er endringer. Hvis ja, lagre (commit) og push (last opp).
          git diff --quiet && git diff --staged --quiet || (git commit -m "Oppdatert status for regnskap" && git push)
