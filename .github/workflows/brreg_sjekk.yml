name: Sjekk Brønnøysundregistrene

on:
  schedule:
    # Kjører kl 12:00 hver dag i norsk tidssone (håndterer sommertid/vintertid automatisk)
    - cron: '0 12 * * *'
      timezone: 'Europe/Oslo'
  workflow_dispatch: # Gir deg en knapp for manuell kjøring

jobs:
  sjekk-regnskap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Sjekk ut kode fra repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kjør Python-script
        env:
          EPOST_PASSORD: ${{ secrets.EPOST_PASSORD }}
        run: python script.py

      - name: Lagre endringer tilbake til GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Legger til alle nye/endrede filer automatisk, uten å krasje hvis de mangler
          git add -A
          
          # Committer og pusher kun hvis det faktisk er gjort en endring
          git diff --quiet && git diff --staged --quiet || (git commit -m "Oppdatert status for regnskap" && git push)
